services:
  postgres:
    image: postgres:18-alpine
    container_name: bookmebus_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - bookmebus-internal

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bookmebus_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}

    ports:
      - "6379:6379"
      - "8001:8001"

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - redis_data:/data

    networks:
      - bookmebus-internal

networks:
  bookmebus-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
