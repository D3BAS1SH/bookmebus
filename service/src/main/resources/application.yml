  spring:
    application:
      name: service

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: false
      validate-on-migrate: true
      out-of-order: false

    datasource:
      url: jdbc:postgresql://localhost:5432/bookmebus
      username: bookmebus-admin
      password: 328f326d29e7c5a566900b325db6d46f4ec3babf2aa38e2a75d32bb73860349e
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000

    data:
      redis:
        password: 928a2d45b80823f2fe2c030a9b72c77468cfaa073221a079d955006009bb3c3c
        host: localhost
        port: 6379
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 4
            min-idle: 1

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
          jdbc:
            batch_size: 20

    servlet:
      multipart:
        enabled: true
        max-file-size: 10MB
        max-request-size: 15MB

  application:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      access-token-expiry: 86400000
      refresh-token-expiry: 604800000

  management:
    endpoints:
      web:
        exposure:
          include: health, info, metrics
    endpoint:
      health:
        show-details: when-authorized

  server:
    port: 8080
    servlet:
      context-path: /

  logging:
    level:
      com.transit.service: debug
      org.springframework.security: debug
      org.hibernate.sql: debug
      org.hibernate.type.descriptor.sql: trace
      org.flywaydb: info
    pattern:
      console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"