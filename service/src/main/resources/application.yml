  spring:
    application:
      name: service

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: false
      validate-on-migrate: true
      out-of-order: false

    datasource:
      url: jdbc:postgresql://localhost:5432/bookmebus
      username: bookmebus-admin
      password: 328f326d29e7c5a566900b325db6d46f4ec3babf2aa38e2a75d32bb73860349e
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000

    data:
      redis:
        password: 928a2d45b80823f2fe2c030a9b72c77468cfaa073221a079d955006009bb3c3c
        host: localhost
        port: 6379
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 4
            min-idle: 1

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
          jdbc:
            batch_size: 20

    servlet:
      multipart:
        enabled: true
        max-file-size: 10MB
        max-request-size: 15MB

  application:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      access-token-expiry: PT24H
    ticket:
      # Directory paths for generated files.
      # In production, point to a persistent volume mount (e.g. /var/transit/tickets).
      # In local dev, relative paths are fine — they resolve from the working directory.
      qr-storage-path: tickets/qr
      pdf-storage-path: tickets/pdf

      # QR image dimensions in pixels (250×250 is readable on most mobile screens)
      qr-width: 250
      qr-height: 250
    proximity:
      # Scheduler fires every 60 seconds (configured in @Scheduled)
      # Average bus speed used for ETA estimation (Haversine / speed = hours)
      avg-speed-kmh: 40
      # SMS is sent when ETA falls within this window (in minutes)
      notify-window-min-minutes: 60
      notify-window-max-minutes: 120
      # Redis TTL for the "already notified" guard key (seconds)
      # Set to 4 hours so the same booking isn't spammed
      sms-guard-ttl-seconds: 14400
    sms:
      # Set to false in dev/test — SmsServiceImpl logs instead of calling API
      enabled: false
      # Supported values: stub | fast2sms | twilio
      provider: stub
      # Fast2SMS — inject via env var in prod
      fast2sms:
        api-key: ${FAST2SMS_API_KEY:}
        route: q          # q = quick transactional
      # Twilio — inject via env var in prod
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha

  management:
    endpoints:
      web:
        exposure:
          include: health, info, metrics
    endpoint:
      health:
        show-details: when-authorized

  server:
    port: 8080
    servlet:
      context-path: /

  logging:
    level:
      com.transit.service: debug
      org.springframework.security: debug
      org.hibernate.sql: debug
      org.hibernate.type.descriptor.sql: trace
      org.flywaydb: debug
      flyway: debug
      root: info
    pattern:
      console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"